# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  ⛔ ПРОДАКШН. НИКОГДА `docker compose down -v` — снесёт БД и фото посылок  ║
# ║  Тома объявлены external: Compose их НЕ создаёт и НЕ удаляет.             ║
# ║  Обновление: docker compose -f docker-compose.prod.yml up -d              ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

services:
  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    container_name: parcel_bot_db
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: parcel_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  # === Redis ===
  redis:
    image: redis:7-alpine
    container_name: parcel_bot_redis
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  # === FastAPI Backend ===
  backend:
    image: ghcr.io/${GITHUB_REPO}/backend:latest
    container_name: parcel_bot_api
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/parcel_bot
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Загруженные фотографии посылок переживают пересборку образа
      - mediadata:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    ports:
      # наружу — только через host-nginx (fly.kazakhindubai.com)
      - "127.0.0.1:8091:8000"
    deploy:
      resources:
        limits:
          memory: 512M

  # === Telegram Bot ===
  bot:
    image: ghcr.io/${GITHUB_REPO}/bot:latest
    container_name: parcel_bot_tg
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/parcel_bot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  # === WebApp (Vue SPA — nginx) ===
  webapp:
    image: ghcr.io/${GITHUB_REPO}/webapp:latest
    container_name: parcel_bot_webapp
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - internal
    ports:
      - "127.0.0.1:8092:80"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  # external: true — тома с боевыми данными не создаются и не удаляются этим compose.
  # Один раз перед первым запуском: docker volume create parcel_bot_pgdata (и остальные).
  pgdata:
    external: true
    name: parcel_bot_pgdata
  redisdata:
    external: true
    name: parcel_bot_redisdata
  mediadata:
    external: true
    name: parcel_bot_mediadata

networks:
  internal:
    driver: bridge
