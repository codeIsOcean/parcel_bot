[alembic]
script_location = alembic
# Консольный скрипт alembic не добавляет рабочую папку в sys.path —
# без этой строки в контейнере падает импорт shared.models
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///./parcel_bot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
