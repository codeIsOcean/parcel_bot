name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Check single Alembic head
        run: |
          # Две головы миграций ломают деплой молча — ловим это до сборки
          heads=$(python -m alembic heads 2>/dev/null | grep -c "(head)" || true)
          if [ "$heads" != "1" ]; then
            echo "Ожидалась одна голова Alembic, найдено: $heads"
            python -m alembic heads
            exit 1
          fi
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run tests
        run: python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # === Backend ===
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # === Bot ===
      - name: Build & Push Bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bot/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}/bot:latest
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      # === WebApp ===
      - name: Build & Push WebApp
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          file: webapp/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}/webapp:latest
          build-args: |
            VITE_API_URL=/api/v1
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,mode=max,scope=webapp

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout (для docker-compose и nginx конфигов)
        uses: actions/checkout@v4

      - name: Copy configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/"
          # Новый сервер (80.209.231.69): проект живёт в /opt/parcel_bot
          target: /opt/parcel_bot/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/parcel_bot

            # Логинимся в GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Экспортируем переменные для docker-compose
            export GITHUB_REPO="${{ github.repository }}"
            GITHUB_REPO="${GITHUB_REPO,,}"

            # Pull новых образов
            docker compose -f docker-compose.prod.yml pull backend bot webapp

            # Дамп базы перед миграцией: схема меняется — откат должен быть возможен
            mkdir -p /opt/parcel_bot/backups
            docker exec parcel_bot_db pg_dump -U postgres parcel_bot | gzip \
              > "/opt/parcel_bot/backups/pre_deploy_$(date +%Y%m%d_%H%M%S).sql.gz"
            # Храним последние 7 дампов
            ls -1t /opt/parcel_bot/backups/pre_deploy_*.sql.gz | tail -n +8 | xargs -r rm -f

            # Миграции — ДО перезапуска приложений и с проверкой кода возврата:
            # сломанная схема не должна уехать на прод «зелёным» деплоем
            echo "Applying Alembic migrations..."
            docker compose -f docker-compose.prod.yml run --rm --no-deps bot alembic upgrade head

            # Graceful deployment: быстрый перезапуск готовых образов (даунтайм ~2-3 сек)
            # --no-deps: не перезапускает dependency контейнеры (postgres, redis)
            # --remove-orphans: удаляет контейнеры которых больше нет в compose
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans backend bot webapp

            # Удаляем старые образы
            docker image prune -f
